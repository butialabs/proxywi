name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to verify for a release
        type: string
        required: false
  pull_request:
  push:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - run: go vet ./...
      - run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  smoke-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Smoke test client configuration diagnostics
        run: |
          docker build -f docker/client/Dockerfile -t proxywi-client:ci .
          if docker run --rm --network none proxywi-client:ci >client.log 2>&1; then
            echo 'Expected the client to reject a missing server configuration'
            exit 1
          fi
          grep -F 'PROXYWI_SERVER is required' client.log

      - name: Build all-in-one image
        run: docker build -f docker/server/Dockerfile -t proxywi:ci .

      - name: Run container
        run: |
          docker run -d --name pw \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=admin \
            -p 3000:3000 -p 8080:8080 proxywi:ci

      - name: Wait for health
        run: |
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 \
               && curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              echo "healthy"; exit 0
            fi
            sleep 3
          done
          echo "service did not become healthy in time"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs pw || true
